<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>孫八 給料計算フォーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --surface-2: #F1ECE3;
    --ink: #2B2A28;
    --muted: #6B6560;
    --line: #E4DDD0;
    --accent: #3F7D6B;
    --accent-ink: #FFFFFF;
    --accent-soft: #E4EFE9;
    --accent-soft-ink: #1F4A3D;
    --danger: #B54A3F;
    --danger-soft: #F6E7E4;
    --warn-soft: #FBEEE0;
    --warn-ink: #7A4A15;
    --shadow: 0 1px 2px rgba(43,42,40,0.05), 0 6px 20px -10px rgba(43,42,40,0.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1A17;
      --surface: #232220;
      --surface-2: #2B2926;
      --ink: #F3F0E9;
      --muted: #A79E93;
      --line: #3A3733;
      --accent: #74C7AC;
      --accent-ink: #10231C;
      --accent-soft: #253630;
      --accent-soft-ink: #A9E6CE;
      --danger: #E28578;
      --danger-soft: #3A2622;
      --warn-soft: #362A1C;
      --warn-ink: #E7B87C;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 6px 20px -10px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1A17;
    --surface: #232220;
    --surface-2: #2B2926;
    --ink: #F3F0E9;
    --muted: #A79E93;
    --line: #3A3733;
    --accent: #74C7AC;
    --accent-ink: #10231C;
    --accent-soft: #253630;
    --accent-soft-ink: #A9E6CE;
    --danger: #E28578;
    --danger-soft: #3A2622;
    --warn-soft: #362A1C;
    --warn-ink: #E7B87C;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 6px 20px -10px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 96px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px 16px 28px; }

  header.hero { margin-bottom: 12px; }
  .eyebrow {
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  h1 {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 900;
    font-size: 1.5rem;
    line-height: 1.4;
    margin: 4px 0 8px;
    text-wrap: balance;
  }
  .lede { color: var(--muted); font-size: 0.95rem; margin: 0; }

  .card {
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 14px;
    margin-bottom: 12px;
  }

  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 6px;
  }
  .field .hint {
    display: block;
    font-weight: 400;
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 4px;
  }
  select, input[type="text"], input[type="number"], input[type="date"] {
    width: 100%;
    font-family: inherit;
    font-size: 1.05rem;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--accent-soft);
    color: var(--ink);
    appearance: none;
    -webkit-appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%);
    background-position: calc(100% - 20px) center, calc(100% - 14px) center;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }
  select:focus, input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  input::placeholder { color: var(--muted); opacity: 0.7; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .record {
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .record-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 9px 16px;
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 1.02rem;
  }
  .record-head .del {
    background: none;
    border: none;
    color: var(--accent-ink);
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0.85;
    padding: 6px 4px;
    cursor: pointer;
  }
  .record-body { padding: 12px 14px; background: var(--surface); }
  .record-breakdown {
    background: var(--surface-2);
    padding: 2px 14px;
    border-top: 1px solid var(--line);
  }
  .record-breakdown .summary-row { padding: 5px 0; font-size: 0.88rem; }
  .record-total {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    background: var(--surface-2);
    padding: 10px 16px;
    font-weight: 700;
  }
  .record-total .amt {
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 1.2rem;
    font-variant-numeric: tabular-nums;
  }

  .banner {
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.85rem;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .banner-warn { background: var(--warn-soft); color: var(--warn-ink); }
  .banner-danger { background: var(--danger-soft); color: var(--danger); }

  .add-btn {
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    border: 2px dashed var(--accent);
    background: var(--accent-soft);
    color: var(--accent-soft-ink);
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .add-btn:active { transform: scale(0.99); }

  .add-item-btn {
    display: block;
    width: 100%;
    padding: 10px;
    margin: -6px 0 16px;
    border-radius: 10px;
    border: 1.5px dashed var(--line);
    background: transparent;
    color: var(--accent);
    font-family: "Noto Sans JP", sans-serif;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .add-item-btn:active { transform: scale(0.99); }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.95rem;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .v { font-variant-numeric: tabular-nums; color: var(--muted); }

  .subtotal-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
    font-size: 0.95rem;
    font-weight: 700;
  }
  .subtotal-row .v { font-variant-numeric: tabular-nums; }
  .subtotal-wrap { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 4px; }

  .grand {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 11px;
    margin-top: 6px;
    border-top: 2px solid var(--line);
    font-weight: 700;
    font-size: 1.05rem;
  }

  .payout-bar {
    position: sticky;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 11px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
    z-index: 20;
  }
  .payout-bar .label { font-weight: 700; font-size: 0.95rem; }
  .payout-bar .amt {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 900;
    font-size: 1.5rem;
    font-variant-numeric: tabular-nums;
  }

  .actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-family: "Noto Sans JP", sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 88px;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 30;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .note {
    background: var(--warn-soft);
    color: var(--warn-ink);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }

  h2.section-title {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    margin: 0 0 12px;
  }
</style>

<div class="wrap">
  <header class="hero">
    <span class="eyebrow">孫八 &middot; 清掃・作業報告</span>
    <h1>給料計算フォーム</h1>
  </header>

  <div class="card">
    <div class="field">
      <label>対象年月</label>
      <div style="display:flex; gap:8px;">
        <select id="year" style="flex:1;"></select>
        <select id="month" style="flex:1;"></select>
      </div>
    </div>
    <div class="field" style="margin-bottom:0;">
      <label for="name">お名前</label>
      <select id="name"></select>
      <input type="text" id="nameOther" placeholder="お名前を入力" style="margin-top:10px; display:none;">
    </div>
  </div>

  <div id="records"></div>

  <button class="add-btn" id="addRecord">＋ 記録を追加</button>

  <div class="card">
    <h2 class="section-title">内訳（今月の合計）</h2>
    <div id="breakdown"></div>
    <div class="subtotal-wrap">
      <div class="subtotal-row"><span>給与・手当</span><span class="v" id="wageTotal">0円</span></div>
      <div class="subtotal-row"><span>立替経費精算</span><span class="v" id="expenseTotal">0円</span></div>
    </div>
    <div class="grand">
      <span>合計金額</span>
      <span class="v" id="grandTotal">0円</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="copyBtn">結果をコピー</button>
    <button class="btn btn-secondary" id="resetBtn">全てリセット</button>
  </div>
</div>

<div class="payout-bar">
  <span class="label">支給額</span>
  <span class="amt" id="payoutAmt">0円</span>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var STAFF = ["沢村", "佐藤", "山本", "谷本", "山根", "谷口"];
  var MINUTE_OPTS = [];
  for (var m = 0; m <= 180; m += 15) MINUTE_OPTS.push(m);
  var COUNT_OPTS = [];
  for (var c = 0; c <= 10; c++) COUNT_OPTS.push(c);
  var SHEET_OPTS = [];
  for (var s = 0; s <= 20; s++) SHEET_OPTS.push(s);

  var STORE_KEY = "mago8_salary_v1";
  // 稼働日に「年」の概念がなかった過去データは、明示的にこの年として移行する。
  // 「今年」を基準に変換すると、翌年以降にアプリを開いたときに過去データの年がズレてしまうため固定値にする。
  var LEGACY_YEAR = 2026;

  var FIELD_DEFS = [
    { key: "date", label: "稼働日", type: "date" },
    { key: "cleaned", label: "清掃をしましたか？", type: "select-yn" },
    { key: "gomi", label: "ゴミ回収をしましたか？", type: "select-umu" },
    { key: "sheets", label: "シーツは何組洗濯しましたか？", type: "select-sheet" },
    { key: "laundry", label: "ランドリー代金はいくらでしたか？（円）", type: "number" },
    { key: "overMin", label: "掃除の延長時間は何分でしたか？（接客なし）", type: "select-min" },
    { key: "dayMin", label: "昼の接客延長時間は何分でしたか？", type: "select-min" },
    { key: "nightMin", label: "夜の接客延長時間は何分でしたか？", type: "select-min" },
    { key: "restockItems", label: "商品補充で買ったもの", type: "restock-items" },
    { key: "lost", label: "忘れ物を何組送りましたか？（1組500円）", type: "select-count" },
    { key: "otherItems", label: "その他", type: "other-items" }
  ];

  // group: "wage" = 給与・手当 / "expense" = 立替経費精算
  var CATEGORY_DEFS = [
    { key: "kiso", label: "基本清掃", group: "wage" },
    { key: "gomi", label: "ゴミ回収", group: "wage" },
    { key: "sheets", label: "シーツ", group: "wage" },
    { key: "laundry", label: "ランドリー", group: "expense" },
    { key: "over", label: "清掃延長（接客なし）", group: "wage" },
    { key: "dayServ", label: "接客延長【昼】", group: "wage" },
    { key: "nightServ", label: "接客延長【夜】", group: "wage" },
    { key: "restockExpense", label: "立替経費精算", group: "expense" },
    { key: "restockAllowance", label: "商品補充手当", group: "wage" },
    { key: "lost", label: "忘れ物送付", group: "wage" },
    { key: "other", label: "その他", group: "wage" }
  ];

  function blankRecord() {
    return {
      date: "", cleaned: "", gomi: "", sheets: "", laundry: "", overMin: "",
      dayMin: "", nightMin: "", restockItems: [{ name: "", amount: "" }], lost: "",
      otherItems: [{ name: "", amount: "" }]
    };
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function migrateItemPairs(items, legacyAmount) {
    if (!items || !items.length) {
      // items が無い最も古い形式：以前の合計金額があれば1件目に引き継ぐ
      return [{ name: "", amount: legacyAmount || "" }];
    }
    if (typeof items[0] === "string") {
      // 名前だけの配列（1つ前の形式）：合計金額は1件目にまとめて引き継ぐ
      return items.map(function (nm, ix) {
        return { name: nm, amount: ix === 0 ? (legacyAmount || "") : "" };
      });
    }
    return items;
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.records)) {
          var legacyMonth = parsed.month || (new Date().getMonth() + 1);
          if (!parsed.year) {
            // 年の概念がなかった過去データは、明示的にLEGACY_YEARのデータとして移行する
            parsed.year = LEGACY_YEAR;
          }
          for (var i = 0; i < parsed.records.length; i++) {
            var rec = parsed.records[i];
            rec.restockItems = migrateItemPairs(rec.restockItems, rec.restock);
            delete rec.restock;
            if (!rec.otherItems || !rec.otherItems.length) {
              // otherText/otherAmt という単一項目だった形式から移行
              rec.otherItems = [{ name: rec.otherText || "", amount: rec.otherAmt || "" }];
            }
            delete rec.otherText;
            delete rec.otherAmt;

            // 清掃有無：古い形式には無いので、日付が入っていれば「清掃した」だった仕様をそのまま引き継ぐ
            if (rec.cleaned === undefined || rec.cleaned === null) {
              rec.cleaned = rec.date ? "はい" : "";
            }
            // 稼働日：日にちだけの古い形式（例:"15"）を YYYY-MM-DD 形式に移行する
            if (rec.date && /^\d{1,2}$/.test(String(rec.date))) {
              rec.date = parsed.year + "-" + pad2(legacyMonth) + "-" + pad2(parseInt(rec.date, 10));
            }
          }
          return parsed;
        }
      }
    } catch (e) {}
    var now = new Date();
    return { month: now.getMonth() + 1, year: now.getFullYear(), name: "", nameOther: "", records: [blankRecord()] };
  }

  var state = loadState();

  function saveState() {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }

  function toHalfWidth(s) {
    // 全角数字・全角ピリオドを半角に変換してから扱う（スマホの入力設定で全角になっても計算できるように）
    return String(s == null ? "" : s)
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/．/g, ".");
  }

  // 計算用：マイナス値は0として扱う
  function num(v) {
    var n = parseFloat(toHalfWidth(v));
    if (isNaN(n)) return 0;
    return n < 0 ? 0 : n;
  }

  // 警告判定用：マイナスかどうかを見るため、クランプ前の値を返す
  function rawNum(v) {
    var n = parseFloat(toHalfWidth(v));
    return isNaN(n) ? 0 : n;
  }

  function isSpecialDate(month, day) {
    if (!day) return false;
    if (month === 12 && day >= 29) return true;
    if (month === 1 && day <= 3) return true;
    if (month === 8 && day >= 13 && day <= 16) return true;
    return false;
  }

  function parseRecordDate(s) {
    if (!s) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) return null;
    return { year: parseInt(m[1], 10), month: parseInt(m[2], 10), day: parseInt(m[3], 10) };
  }

  function calcRecord(r, month, year) {
    var dateInfo = parseRecordDate(r.date);
    var dateMismatch = !!(dateInfo && (dateInfo.year !== year || dateInfo.month !== month));

    if (dateMismatch) {
      // 対象年月と稼働日が一致しない記録は、この記録だけ給与計算から除外する
      return {
        kiso: 0, gomi: 0, sheets: 0, laundry: 0, over: 0, dayServ: 0, nightServ: 0,
        restockExpense: 0, restockAllowance: 0, lost: 0, other: 0, total: 0,
        dateMismatch: true
      };
    }

    var kiso = (r.cleaned === "はい" && dateInfo) ? (isSpecialDate(dateInfo.month, dateInfo.day) ? 4000 : 3300) : 0;
    var gomi = r.gomi === "した" ? 300 : 0;
    var sheets = num(r.sheets) * 150;
    var laundry = num(r.laundry);
    var over = (num(r.overMin) / 60) * 1100;
    var dayServ = (num(r.dayMin) / 60) * 1300;
    var nightServ = (num(r.nightMin) / 60) * 1700;
    var restockSum = 0;
    if (r.restockItems) {
      for (var ri = 0; ri < r.restockItems.length; ri++) {
        restockSum += num(r.restockItems[ri].amount);
      }
    }
    // 支給額の計算式は今まで通り restockSum * 1.1 のまま変えない（金額を1円たりともズレさせないため）
    var restock = restockSum * 1.1;
    // 立替経費精算（実費そのまま）と商品補充手当（10%相当）を、上のrestockから逆算する。
    // restockExpense + restockAllowance が必ずrestockと完全一致するよう、独立に計算せず引き算で出す。
    var restockExpense = restockSum;
    var restockAllowance = restock - restockExpense;
    var lost = num(r.lost) * 500;
    var other = 0;
    if (r.otherItems) {
      for (var oi = 0; oi < r.otherItems.length; oi++) {
        other += num(r.otherItems[oi].amount);
      }
    }
    var total = kiso + gomi + sheets + laundry + over + dayServ + nightServ + restock + lost + other;
    return {
      kiso: kiso, gomi: gomi, sheets: sheets, laundry: laundry, over: over,
      dayServ: dayServ, nightServ: nightServ, restock: restock,
      restockExpense: restockExpense, restockAllowance: restockAllowance,
      lost: lost, other: other, total: total, dateMismatch: false
    };
  }

  function yen(n) {
    return Math.round(n).toLocaleString("ja-JP") + "円";
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function optionsHtml(list, formatter, selected) {
    var html = '<option value="">-</option>';
    for (var i = 0; i < list.length; i++) {
      var v = list[i];
      var text = formatter ? formatter(v) : String(v);
      var sel = (String(v) === String(selected)) ? " selected" : "";
      html += '<option value="' + v + '"' + sel + '>' + text + "</option>";
    }
    return html;
  }

  function fieldControlHtml(def, value, idx) {
    var name = "r" + idx + "_" + def.key;
    if (def.type === "date") {
      return '<input type="date" data-key="' + def.key + '" data-idx="' + idx + '" name="' + name +
        '" value="' + escapeHtml(value) + '">';
    }
    if (def.type === "select-yn") {
      var ynOpts = ["はい", "いいえ"];
      var ynHtml = '<option value="">-</option>';
      for (var y = 0; y < ynOpts.length; y++) {
        var ySel = ynOpts[y] === value ? " selected" : "";
        ynHtml += '<option value="' + ynOpts[y] + '"' + ySel + '>' + ynOpts[y] + "</option>";
      }
      return '<select data-key="' + def.key + '" data-idx="' + idx + '" name="' + name + '">' + ynHtml + "</select>";
    }
    if (def.type === "select-umu") {
      var opts = ["した", "していない"];
      var html = '<option value="">-</option>';
      for (var i = 0; i < opts.length; i++) {
        var sel = opts[i] === value ? " selected" : "";
        html += '<option value="' + opts[i] + '"' + sel + '>' + opts[i] + "</option>";
      }
      return '<select data-key="' + def.key + '" data-idx="' + idx + '" name="' + name + '">' + html + "</select>";
    }
    if (def.type === "select-sheet") {
      return '<select data-key="' + def.key + '" data-idx="' + idx + '" name="' + name + '">' +
        optionsHtml(SHEET_OPTS, function (v) { return v + "組"; }, value) + "</select>";
    }
    if (def.type === "select-min") {
      return '<select data-key="' + def.key + '" data-idx="' + idx + '" name="' + name + '">' +
        optionsHtml(MINUTE_OPTS, function (v) { return v + "分"; }, value) + "</select>";
    }
    if (def.type === "select-count") {
      return '<select data-key="' + def.key + '" data-idx="' + idx + '" name="' + name + '">' +
        optionsHtml(COUNT_OPTS, function (v) { return v + "組"; }, value) + "</select>";
    }
    if (def.type === "number") {
      // type="text" にして、数字プルダウン風のスピナーが出ないようにする（直接入力のみ）
      return '<input type="text" inputmode="decimal" pattern="[0-9]*" placeholder="0" data-key="' + def.key +
        '" data-idx="' + idx + '" name="' + name + '" value="' + escapeHtml(value) + '">';
    }
    // text
    return '<input type="text" placeholder="' + escapeHtml(def.placeholder || "") + '" data-key="' + def.key +
      '" data-idx="' + idx + '" name="' + name + '" value="' + escapeHtml(value) + '">';
  }

  function itemNameFilled(item) {
    return !!(item && item.name && String(item.name).trim() !== "");
  }

  function restockItemsHtml(items, idx) {
    items = (items && items.length) ? items : [{ name: "", amount: "" }];
    var html = "";
    for (var i = 0; i < items.length; i++) {
      var lbl = i === 0 ? "購入した商品" : "購入した商品（" + (i + 1) + "つ目）";
      var showAmt = itemNameFilled(items[i]);
      html += '<div class="field"><label>' + lbl + "</label>" +
        '<input type="text" placeholder="例：洗剤" data-item-idx="' + idx + '" data-item-n="' + i +
        '" value="' + escapeHtml(items[i].name) + '"></div>';
      html += '<div class="field restock-amt-field" data-restockamt="' + idx + "_" + i +
        '" style="' + (showAmt ? "" : "display:none;") + '"><label>買った商品の代金は？（円）</label>' +
        '<input type="text" inputmode="decimal" pattern="[0-9]*" placeholder="0" data-itemamt-idx="' + idx +
        '" data-itemamt-n="' + i + '" value="' + escapeHtml(items[i].amount) + '"></div>';
    }
    html += '<button type="button" class="add-item-btn" data-additem="' + idx + '">＋ 商品を追加</button>';
    return html;
  }

  function otherItemsHtml(items, idx) {
    items = (items && items.length) ? items : [{ name: "", amount: "" }];
    var html = "";
    for (var i = 0; i < items.length; i++) {
      var lbl = i === 0 ? "その他" : "その他（" + (i + 1) + "つ目）";
      var showAmt = itemNameFilled(items[i]);
      html += '<div class="field"><label>' + lbl + "</label>" +
        '<input type="text" data-otheritem-idx="' + idx + '" data-otheritem-n="' + i +
        '" value="' + escapeHtml(items[i].name) + '"></div>';
      html += '<div class="field restock-amt-field" data-otheritemamt="' + idx + "_" + i +
        '" style="' + (showAmt ? "" : "display:none;") + '"><label>その他の金額は？（円）</label>' +
        '<input type="text" inputmode="decimal" pattern="[0-9]*" placeholder="0" data-otheritemamt-idx="' + idx +
        '" data-otheritemamt-n="' + i + '" value="' + escapeHtml(items[i].amount) + '"></div>';
    }
    html += '<button type="button" class="add-item-btn" data-addotheritem="' + idx + '">＋ その他を追加</button>';
    return html;
  }

  function renderMonthYearName() {
    var yearSel = document.getElementById("year");
    var curYear = new Date().getFullYear();
    var years = [];
    for (var y = curYear - 1; y <= curYear + 2; y++) years.push(y);
    if (years.indexOf(state.year) === -1) years.push(state.year);
    years.sort(function (a, b) { return a - b; });
    yearSel.innerHTML = optionsHtml(years, function (v) { return v + "年"; }, state.year).replace('<option value="">-</option>', "");

    var monthSel = document.getElementById("month");
    var months = [];
    for (var i = 1; i <= 12; i++) months.push(i);
    monthSel.innerHTML = optionsHtml(months, function (v) { return v + "月"; }, state.month).replace('<option value="">-</option>', "");

    var nameSel = document.getElementById("name");
    var html = '<option value="">-</option>';
    for (var j = 0; j < STAFF.length; j++) {
      var sel = STAFF[j] === state.name ? " selected" : "";
      html += '<option value="' + STAFF[j] + '"' + sel + '>' + STAFF[j] + "</option>";
    }
    var otherSel = state.name === "__other__" ? " selected" : "";
    html += '<option value="__other__"' + otherSel + '>その他（新しいスタッフ）</option>';
    nameSel.innerHTML = html;

    var otherInput = document.getElementById("nameOther");
    if (state.name === "__other__") {
      otherInput.style.display = "block";
      otherInput.value = state.nameOther || "";
    } else {
      otherInput.style.display = "none";
    }
  }

  // ---- 入力値の異常チェック（警告のみ、登録は止めない） ----
  function getRecordWarnings(r) {
    var warnings = [];
    function checkField(rawVal, label, cap) {
      var raw = rawNum(rawVal);
      if (raw < 0) {
        warnings.push(label + "がマイナスになっています（0として計算します）");
      } else if (cap && raw > cap) {
        warnings.push(label + "が高額です（" + yen(cap) + "超）。入力内容をご確認ください");
      }
    }
    checkField(r.laundry, "ランドリー代金", 10000);
    if (r.restockItems) {
      r.restockItems.forEach(function (it, i) {
        if (itemNameFilled(it) || rawNum(it.amount) !== 0) {
          checkField(it.amount, "購入した商品「" + (it.name || (i + 1) + "つ目") + "」の金額", 20000);
        }
      });
    }
    if (r.otherItems) {
      r.otherItems.forEach(function (it, i) {
        if (itemNameFilled(it) || rawNum(it.amount) !== 0) {
          checkField(it.amount, "その他「" + (it.name || (i + 1) + "つ目") + "」の金額", 20000);
        }
      });
    }
    return warnings;
  }

  function findDuplicateDates() {
    var counts = {};
    state.records.forEach(function (r) {
      if (r.date) counts[r.date] = (counts[r.date] || 0) + 1;
    });
    return counts;
  }

  function recordBreakdownHtml(calc) {
    var lines = [];
    for (var i = 0; i < CATEGORY_DEFS.length; i++) {
      var def = CATEGORY_DEFS[i];
      var v = calc[def.key];
      if (v > 0) {
        lines.push('<div class="summary-row"><span>' + def.label + '</span><span class="v">' + yen(v) + "</span></div>");
      }
    }
    if (!lines.length) return "";
    return '<div class="record-breakdown">' + lines.join("") + "</div>";
  }

  function renderRecords() {
    var container = document.getElementById("records");
    var dupCounts = findDuplicateDates();
    var html = "";
    for (var idx = 0; idx < state.records.length; idx++) {
      var r = state.records[idx];
      var calc = calcRecord(r, num(state.month), num(state.year));
      html += '<div class="record" data-record="' + idx + '">';
      html += '<div class="record-head"><span>' + (idx + 1) + ' 回目の記録</span>' +
        (state.records.length > 1 ? '<button class="del" data-del="' + idx + '" type="button">削除</button>' : "") +
        "</div>";
      html += '<div class="record-body">';

      if (calc.dateMismatch) {
        html += '<div class="banner banner-danger">対象月と稼働日の月が一致していません（この記録は計算に含まれません）</div>';
      }
      if (r.date && dupCounts[r.date] > 1) {
        html += '<div class="banner banner-warn">同じ日の稼働記録がすでにあります。重複していないか確認してください</div>';
      }
      getRecordWarnings(r).forEach(function (w) {
        html += '<div class="banner banner-warn">' + escapeHtml(w) + "</div>";
      });

      for (var f = 0; f < FIELD_DEFS.length; f++) {
        var def = FIELD_DEFS[f];
        if (def.type === "restock-items") {
          html += restockItemsHtml(r.restockItems, idx);
          continue;
        }
        if (def.type === "other-items") {
          html += otherItemsHtml(r.otherItems, idx);
          continue;
        }
        html += '<div class="field"><label>' + def.label + "</label>" +
          fieldControlHtml(def, r[def.key], idx) +
          (def.hint ? '<span class="hint">' + def.hint + "</span>" : "") +
          "</div>";
      }
      html += "</div>";
      html += recordBreakdownHtml(calc);
      html += '<div class="record-total"><span>この記録の合計</span><span class="amt">' + yen(calc.total) + "</span></div>";
      html += "</div>";
    }
    container.innerHTML = html;
  }

  function recalcTotals() {
    var totals = {};
    for (var i = 0; i < CATEGORY_DEFS.length; i++) totals[CATEGORY_DEFS[i].key] = 0;
    var grand = 0;
    for (var j = 0; j < state.records.length; j++) {
      var c = calcRecord(state.records[j], num(state.month), num(state.year));
      totals.kiso += c.kiso;
      totals.gomi += c.gomi;
      totals.sheets += c.sheets;
      totals.laundry += c.laundry;
      totals.over += c.over;
      totals.dayServ += c.dayServ;
      totals.nightServ += c.nightServ;
      totals.restockExpense += c.restockExpense;
      totals.restockAllowance += c.restockAllowance;
      totals.lost += c.lost;
      totals.other += c.other;
      grand += c.total;
    }
    var wageTotal = 0, expenseTotal = 0;
    for (var k = 0; k < CATEGORY_DEFS.length; k++) {
      var d = CATEGORY_DEFS[k];
      if (d.group === "wage") wageTotal += totals[d.key];
      else expenseTotal += totals[d.key];
    }

    var breakdownEl = document.getElementById("breakdown");
    var html = "";
    for (var mI = 0; mI < CATEGORY_DEFS.length; mI++) {
      var def2 = CATEGORY_DEFS[mI];
      html += '<div class="summary-row"><span>' + def2.label + '</span><span class="v">' + yen(totals[def2.key]) + "</span></div>";
    }
    breakdownEl.innerHTML = html;

    document.getElementById("wageTotal").textContent = yen(wageTotal);
    document.getElementById("expenseTotal").textContent = yen(expenseTotal);
    document.getElementById("grandTotal").textContent = yen(grand);
    var payout = Math.ceil(grand / 50) * 50;
    document.getElementById("payoutAmt").textContent = yen(payout);
    return { grand: grand, payout: payout, wageTotal: wageTotal, expenseTotal: expenseTotal };
  }

  function updateRecordTotalDisplay(idx) {
    var recordEl = document.querySelector('.record[data-record="' + idx + '"] .record-total .amt');
    if (recordEl) {
      var calc = calcRecord(state.records[idx], num(state.month), num(state.year));
      recordEl.textContent = yen(calc.total);
    }
  }

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  // ---- events ----
  document.getElementById("year").addEventListener("change", function (e) {
    state.year = num(e.target.value);
    saveState();
    renderRecords();
    recalcTotals();
  });

  document.getElementById("month").addEventListener("change", function (e) {
    state.month = num(e.target.value);
    saveState();
    renderRecords();
    recalcTotals();
  });

  document.getElementById("name").addEventListener("change", function (e) {
    state.name = e.target.value;
    saveState();
    renderMonthYearName();
  });

  document.getElementById("nameOther").addEventListener("input", function (e) {
    state.nameOther = e.target.value;
    saveState();
  });

  function normalizeMoneyInput(el) {
    // 全角で入力しても、見た目も半角に直して分かりやすくする
    var fixed = toHalfWidth(el.value);
    if (fixed !== el.value) el.value = fixed;
    return fixed;
  }

  document.getElementById("records").addEventListener("input", function (e) {
    var t = e.target;
    var itemIdx = t.getAttribute("data-item-idx");
    if (itemIdx !== null) {
      var ridx = parseInt(itemIdx, 10);
      var n = parseInt(t.getAttribute("data-item-n"), 10);
      if (!state.records[ridx].restockItems) state.records[ridx].restockItems = [{ name: "", amount: "" }];
      if (!state.records[ridx].restockItems[n]) state.records[ridx].restockItems[n] = { name: "", amount: "" };
      state.records[ridx].restockItems[n].name = t.value;
      saveState();
      var amtField = document.querySelector('.restock-amt-field[data-restockamt="' + ridx + "_" + n + '"]');
      if (amtField) {
        amtField.style.display = itemNameFilled(state.records[ridx].restockItems[n]) ? "" : "none";
      }
      return;
    }
    var itemAmtIdx = t.getAttribute("data-itemamt-idx");
    if (itemAmtIdx !== null) {
      var aridx = parseInt(itemAmtIdx, 10);
      var an = parseInt(t.getAttribute("data-itemamt-n"), 10);
      if (!state.records[aridx].restockItems) state.records[aridx].restockItems = [{ name: "", amount: "" }];
      if (!state.records[aridx].restockItems[an]) state.records[aridx].restockItems[an] = { name: "", amount: "" };
      state.records[aridx].restockItems[an].amount = normalizeMoneyInput(t);
      saveState();
      updateRecordTotalDisplay(aridx);
      recalcTotals();
      return;
    }
    var otherItemIdx = t.getAttribute("data-otheritem-idx");
    if (otherItemIdx !== null) {
      var oridx = parseInt(otherItemIdx, 10);
      var on = parseInt(t.getAttribute("data-otheritem-n"), 10);
      if (!state.records[oridx].otherItems) state.records[oridx].otherItems = [{ name: "", amount: "" }];
      if (!state.records[oridx].otherItems[on]) state.records[oridx].otherItems[on] = { name: "", amount: "" };
      state.records[oridx].otherItems[on].name = t.value;
      saveState();
      var otherAmtField = document.querySelector('.restock-amt-field[data-otheritemamt="' + oridx + "_" + on + '"]');
      if (otherAmtField) {
        otherAmtField.style.display = itemNameFilled(state.records[oridx].otherItems[on]) ? "" : "none";
      }
      return;
    }
    var otherItemAmtIdx = t.getAttribute("data-otheritemamt-idx");
    if (otherItemAmtIdx !== null) {
      var oaridx = parseInt(otherItemAmtIdx, 10);
      var oan = parseInt(t.getAttribute("data-otheritemamt-n"), 10);
      if (!state.records[oaridx].otherItems) state.records[oaridx].otherItems = [{ name: "", amount: "" }];
      if (!state.records[oaridx].otherItems[oan]) state.records[oaridx].otherItems[oan] = { name: "", amount: "" };
      state.records[oaridx].otherItems[oan].amount = normalizeMoneyInput(t);
      saveState();
      updateRecordTotalDisplay(oaridx);
      recalcTotals();
      return;
    }
    var key = t.getAttribute("data-key");
    var idx = t.getAttribute("data-idx");
    if (key === null || idx === null) return;
    idx = parseInt(idx, 10);
    if (t.getAttribute("inputmode") === "decimal") {
      state.records[idx][key] = normalizeMoneyInput(t);
    } else {
      state.records[idx][key] = t.value;
    }
    saveState();
    updateRecordTotalDisplay(idx);
    recalcTotals();
  });

  // 値が確定したタイミング（フォーカスが外れた・プルダウンを選んだ）で、
  // 警告バナー・重複表示・不一致表示を含めて記録欄全体を作り直す
  document.getElementById("records").addEventListener("change", function (e) {
    var t = e.target;
    // data-keyを持つ要素（select・日付・テキスト）は、changeでも念のため必ず反映する
    // （"input"イベントが先に発火している前提だが、ブラウザによる違いに備えた二重の安全策）
    if (t.hasAttribute && t.hasAttribute("data-key")) {
      var key = t.getAttribute("data-key");
      var idx = parseInt(t.getAttribute("data-idx"), 10);
      if (t.getAttribute("inputmode") === "decimal") {
        state.records[idx][key] = normalizeMoneyInput(t);
      } else {
        state.records[idx][key] = t.value;
      }
      saveState();
    }
    renderRecords();
    recalcTotals();
  });

  document.getElementById("records").addEventListener("click", function (e) {
    var delIdx = e.target.getAttribute("data-del");
    if (delIdx !== null) {
      state.records.splice(parseInt(delIdx, 10), 1);
      saveState();
      renderRecords();
      recalcTotals();
      return;
    }
    var addItemIdx = e.target.getAttribute("data-additem");
    if (addItemIdx !== null) {
      var ridx = parseInt(addItemIdx, 10);
      if (!state.records[ridx].restockItems) state.records[ridx].restockItems = [{ name: "", amount: "" }];
      state.records[ridx].restockItems.push({ name: "", amount: "" });
      saveState();
      renderRecords();
      recalcTotals();
      return;
    }
    var addOtherItemIdx = e.target.getAttribute("data-addotheritem");
    if (addOtherItemIdx !== null) {
      var oridx2 = parseInt(addOtherItemIdx, 10);
      if (!state.records[oridx2].otherItems) state.records[oridx2].otherItems = [{ name: "", amount: "" }];
      state.records[oridx2].otherItems.push({ name: "", amount: "" });
      saveState();
      renderRecords();
      recalcTotals();
    }
  });

  document.getElementById("addRecord").addEventListener("click", function () {
    state.records.push(blankRecord());
    saveState();
    renderRecords();
    recalcTotals();
    var els = document.querySelectorAll(".record");
    if (els.length) els[els.length - 1].scrollIntoView({ block: "start" });
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (confirm("入力した内容をすべて消して、最初からやり直しますか？")) {
      state = { month: state.month, year: state.year, name: "", nameOther: "", records: [blankRecord()] };
      saveState();
      renderMonthYearName();
      renderRecords();
      recalcTotals();
      showToast("リセットしました");
    }
  });

  function describeRecord(r, month, year) {
    var calc = calcRecord(r, num(month), num(year));
    var dateInfo = parseRecordDate(r.date);
    var dayLabel = dateInfo ? (dateInfo.month + "/" + dateInfo.day) : "（稼働日未入力）";

    if (calc.dateMismatch) {
      return dayLabel + "：⚠対象月と稼働日が一致していないため、計算対象外です";
    }

    var parts = [];
    if (r.cleaned === "はい") parts.push("清掃あり");
    if (r.gomi === "した") parts.push("ゴミ回収");
    if (num(r.sheets) > 0) parts.push("シーツ" + num(r.sheets) + "組");
    if (num(r.laundry) > 0) parts.push("ランドリー" + yen(num(r.laundry)));
    if (num(r.overMin) > 0) parts.push("清掃超過" + num(r.overMin) + "分");
    if (num(r.dayMin) > 0) parts.push("昼接客" + num(r.dayMin) + "分");
    if (num(r.nightMin) > 0) parts.push("夜接客" + num(r.nightMin) + "分");
    if (r.restockItems) {
      var restockNames = r.restockItems.filter(itemNameFilled).map(function (it) {
        var amt = num(it.amount);
        if (amt <= 0) return it.name;
        var itemRestock = amt * 1.1;
        var itemAllowance = itemRestock - amt;
        return it.name + "(立替" + yen(amt) + "＋手当" + yen(itemAllowance) + ")";
      });
      if (restockNames.length) parts.push("商品補充:" + restockNames.join("・"));
    }
    if (num(r.lost) > 0) parts.push("忘れ物" + num(r.lost) + "組");
    if (r.otherItems) {
      var otherNames = r.otherItems.filter(itemNameFilled).map(function (it) {
        return it.name + (num(it.amount) > 0 ? "(" + yen(num(it.amount)) + ")" : "");
      });
      if (otherNames.length) parts.push("その他:" + otherNames.join("・"));
    }
    var detail = parts.length ? parts.join("・") : "（未入力）";
    return dayLabel + "：" + detail + " → " + yen(calc.total);
  }

  document.getElementById("copyBtn").addEventListener("click", function () {
    // ③ 名前・稼働日の必須チェック（結果コピー時のみ。画面上のリアルタイム計算は止めない）
    var displayName = state.name === "__other__" ? state.nameOther : state.name;
    var missing = [];
    if (!displayName || !String(displayName).trim()) missing.push("お名前を入力してください");
    state.records.forEach(function (r, i) {
      if (!r.date) missing.push((i + 1) + "回目の記録：稼働日を入力してください");
    });
    if (missing.length) {
      alert(missing.join("\n"));
      return;
    }

    var totals = recalcTotals();
    var lines = state.records.map(function (r) { return describeRecord(r, state.month, state.year); });
    var text = "【孫八 給料報告】\n対象年月: " + num(state.year) + "年" + num(state.month) + "月\nお名前: " + displayName +
      "\n\n" + lines.join("\n") +
      "\n\n給与・手当: " + yen(totals.wageTotal) +
      "\n立替経費精算: " + yen(totals.expenseTotal) +
      "\n合計金額: " + yen(totals.grand) + "\n支給額: " + yen(totals.payout);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("コピーしました。LINEに貼り付けてください");
      }).catch(function () {
        showToast("コピーできませんでした");
      });
    } else {
      showToast("このブラウザはコピーに対応していません");
    }
  });

  function hasAnyData(st) {
    for (var i = 0; i < st.records.length; i++) {
      var r = st.records[i];
      if (r.date || r.cleaned || r.gomi || r.sheets || r.laundry || r.overMin || r.dayMin || r.nightMin || r.lost) return true;
      if (r.restockItems && r.restockItems.some(function (it) {
        return itemNameFilled(it) || (it.amount && String(it.amount).trim() !== "");
      })) return true;
      if (r.otherItems && r.otherItems.some(function (it) {
        return itemNameFilled(it) || (it.amount && String(it.amount).trim() !== "");
      })) return true;
    }
    return false;
  }

  // 実際の今年月と、保存されている対象年月がずれていたら、新しい月として始めるか確認する
  (function checkNewMonth() {
    var now = new Date();
    var currentMonth = now.getMonth() + 1;
    var currentYear = now.getFullYear();
    if ((state.month !== currentMonth || state.year !== currentYear) && hasAnyData(state)) {
      var startFresh = confirm(
        "前回は" + state.year + "年" + state.month + "月のデータが入力されたままです。\n" +
        currentYear + "年" + currentMonth + "月分として新しく入力を始めますか？\n\n" +
        "OK：新しい月として最初からやり直す\n" +
        "キャンセル：前回のデータをそのまま続ける（まだ報告していない場合など）"
      );
      if (startFresh) {
        state = { month: currentMonth, year: currentYear, name: state.name, nameOther: state.nameOther, records: [blankRecord()] };
        saveState();
      }
    }
  })();

  // ---- init ----
  renderMonthYearName();
  renderRecords();
  recalcTotals();
})();
</script>
